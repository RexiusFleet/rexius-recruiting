# Publishes web/ to GitHub Pages on every push to main that touches it (Phase 8).
#
# web/config.js is committed with the local Docker stack's values so `npx serve web` keeps
# working for developers. This workflow overwrites that one file in the deployed copy with the
# hosted project's URL and publishable key, read from repository variables (Settings -> Secrets
# and variables -> Actions -> Variables; README step 13). Both values are public by design: the
# key only identifies the project and row-level security in schema `recruiting` decides what a
# signed-in user can see. Nothing else in web/ changes, and nothing is built.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write web/config.js for the hosted project
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          : "${SUPABASE_URL:=https://hibjqcgitqtgmkurghlw.supabase.co}"
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables (README step 13)."
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*)
              echo "::error::SUPABASE_PUBLISHABLE_KEY looks like a secret key. Only the publishable (anon) key may be deployed."
              exit 1 ;;
          esac
          cat > web/config.js <<CFG
          // Generated by .github/workflows/pages.yml at deploy time. Hosted project values; both are
          // public by design (see the committed web/config.js for the explanation).
          window.RECRUITER_CONFIG = {
            supabaseUrl: "${SUPABASE_URL}",
            supabaseKey: "${SUPABASE_PUBLISHABLE_KEY}"
          };
          CFG
          echo "config.js written for ${SUPABASE_URL}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
