# Publishes web/ to GitHub Pages on every push to main that touches it (Phase 8).
#
# web/config.js is committed with the local Docker stack's values so `npx serve web` keeps
# working for developers. This workflow overwrites that one file in the deployed copy with the
# hosted project's URL and publishable key, read from repository variables (Settings -> Secrets
# and variables -> Actions -> Variables; README step 13). Both values are public by design: the
# key only identifies the project and row-level security in schema `recruiting` decides what a
# signed-in user can see. The only other change is the version stamp for the update prompt
# (scripts/pages/stamp-version.sh); nothing is built.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Write web/config.js for the hosted project
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          : "${SUPABASE_URL:=https://hibjqcgitqtgmkurghlw.supabase.co}"
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables (README step 13)."
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*)
              echo "::error::SUPABASE_PUBLISHABLE_KEY looks like a secret key. Only the publishable (anon) key may be deployed."
              exit 1 ;;
          esac
          # Both values are written into JavaScript below, so they must look like what they are.
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL should be https://<project ref>.supabase.co"; exit 1 ;;
          esac
          case "$SUPABASE_URL$SUPABASE_PUBLISHABLE_KEY" in
            *[!A-Za-z0-9._:/_-]*) echo "::error::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY contains a character that does not belong in either."; exit 1 ;;
          esac
          cat > web/config.js <<CFG
          // Generated by .github/workflows/pages.yml at deploy time. Hosted project values; both are
          // public by design (see the committed web/config.js for the explanation).
          window.RECRUITER_CONFIG = {
            supabaseUrl: "${SUPABASE_URL}",
            supabaseKey: "${SUPABASE_PUBLISHABLE_KEY}"
          };
          CFG
          echo "config.js written for ${SUPABASE_URL}"

      - name: Stamp the version for the update prompt
        # web/update-check.js compares this with version.json and offers a restart after a deploy.
        run: scripts/pages/stamp-version.sh web "${GITHUB_SHA::12}"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web

      # The publish step asks GitHub for the package the step above just uploaded. Now and then
      # GitHub has not listed it yet and answers "No artifacts named github-pages were found",
      # which failed the run (2026-11-19, and twice on 2026-11-27) although nothing was wrong
      # with the site. So: a short wait first, and if the publish still fails, a longer wait and
      # one more try. The run fails, and sends its email, only when the second try fails too.
      - name: Give GitHub a moment to list the uploaded site
        run: sleep 15

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::The first publish attempt failed; trying once more in 60 seconds."
          sleep 60

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
