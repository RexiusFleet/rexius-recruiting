# Runs the project's tests on every pull request and on main (added after the 2026-11-26 review;
# until then nothing ran them, and a push to main publishes the site).
#
#   unit      the Node tests (import cleanup, careers sync rules, market link rules) and the
#             hash check for web/index.html (npm run csp:check). Seconds.
#   policies  starts the local Supabase stack, applies every migration and the seed, and runs
#             scripts/test-policies.sql: one FAIL or UNEXPECTED line fails the job. A few minutes.
#
# Nothing here touches the hosted project and no secret is used. To make these required before
# merging, a repository owner adds them under Settings -> Branches -> branch protection for main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run backfill:test
      - run: npm run careers:test
      - run: npm run market:test
      - run: npm run csp:check

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.0
      - name: Start the local stack (database, auth and storage are all the checks need)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,mailpit,postgres-meta,supavisor
      - name: Run the policy checks
        run: |
          db=$(docker ps --format '{{.Names}}' | grep '^supabase_db_')
          docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=0 -f - < scripts/test-policies.sql > policy-results.txt 2>&1 || true
          echo "$(grep -c '^PASS' policy-results.txt) checks passed"
          if grep -E '^FAIL|UNEXPECTED' policy-results.txt; then
            echo "::error::Policy checks failed (lines above)."
            exit 1
          fi
          # Every check must report. A statement that errors prints neither PASS nor FAIL, so
          # compare the number of PASS lines with the number of checks in the script.
          expected=$(grep -o 'select pg_temp.check(' scripts/test-policies.sql | wc -l)
          passed=$(grep -c '^PASS' policy-results.txt)
          if [ "$passed" -ne "$expected" ]; then
            echo "::error::$passed of $expected checks reported. Errors and the checks that did not pass:"
            grep -n 'ERROR' policy-results.txt | head -40 || true
            grep -o "select pg_temp.check('[^']*'" scripts/test-policies.sql | sed "s/select pg_temp.check('//; s/'$//" | sort > expected-labels.txt
            grep '^PASS ' policy-results.txt | sed 's/^PASS //' | sort > passed-labels.txt
            comm -23 expected-labels.txt passed-labels.txt | head -40
            exit 1
          fi
